<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      const path = window.location.pathname.replace(/^\/+|\/+$/g, "");
      if (path) {
        window.location.replace("/?v=" + encodeURIComponent(path));
      } else {
        window.location.replace("/");
      }
    </script>
  </head>
  <body></body>
</html>
